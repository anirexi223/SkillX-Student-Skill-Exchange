{% extends "base.html" %}{% block content %}<div class="form-card narrow"><h1>Schedule Session</h1><p>Plan your {{skill.name}} exchange session.</p><form method="post"><label>Date</label><input type="date" name="date" required><label>Time</label><input type="time" name="time" required><label>Duration</label><select name="duration"><option value="30">30 minutes</option><option value="60" selected>60 minutes</option><option value="90">90 minutes</option><option value="120">2 hours</option></select><label>Mode</label><select name="mode"><option>Online</option><option>Offline</option></select><label>Notes</label><textarea name="notes" placeholder="Meeting details or topics..."></textarea><button class="btn primary full">Schedule Session</button></form></div>{% endblock %}
