{% extends "base.html" %}{% block content %}<div class="page-head"><div><span class="eyebrow">AI PRACTICE</span><h1>Quiz Generator</h1><p>Create a quick five-question knowledge check.</p></div></div><div class="ai-panel"><form method="post" class="ai-form"><label>Topic</label><input name="topic" value="{{topic}}" required><button class="btn primary">Generate quiz ✦</button></form></div>{% if questions %}<div class="quiz-list">{% for q,opts,ans in questions %}<div class="quiz-card"><span class="eyebrow">QUESTION {{loop.index}}</span><h3>{{q}}</h3>{% for o in opts %}<label class="quiz-option"><input type="radio" name="q{{loop.index}}"> {{o}}</label>{% endfor %}</div>{% endfor %}</div>{% endif %}{% endblock %}
