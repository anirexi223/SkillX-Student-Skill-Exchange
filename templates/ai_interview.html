{% extends "base.html" %}{% block content %}<div class="page-head"><div><span class="eyebrow">AI INTERVIEW LAB</span><h1>Practice Interview</h1><p>Generate questions around a technology or role.</p></div></div><div class="ai-panel"><form method="post" class="ai-form"><label>Topic</label><input name="topic" value="{{topic}}" placeholder="Python, SQL, Data Science..." required><button class="btn primary">Generate questions ✦</button></form></div>{% if questions %}<div class="question-list">{% for q in questions %}<div class="question"><span>Q{{loop.index}}</span><div><b>{{q}}</b><textarea placeholder="Type your answer here..."></textarea><small>Tip: answer with definition → example → trade-off → learning.</small></div></div>{% endfor %}</div>{% endif %}{% endblock %}
