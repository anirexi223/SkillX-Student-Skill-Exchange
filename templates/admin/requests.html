{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>Requests Management</h1><p>View and manage all exchange requests.</p></div></div><div class="table-wrap"><table><thead><tr><th>Sender</th><th>Receiver</th><th>Learn</th><th>Offered</th><th>Status</th><th>Action</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.sender_name}}</td><td>{{r.receiver_name}}</td><td>{{r.learn_skill}}</td><td>{{r.offered_skill or '—'}}</td><td><span class="pill {{r.status}}">{{r.status}}</span></td><td><form method="post" onsubmit="return confirm('Delete this request?')"><input type="hidden" name="id" value="{{r.id}}"><button class="btn danger">Delete</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
