{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>Skills Management</h1><p>Review all skills listed on the platform.</p></div></div><div class="table-wrap"><table><thead><tr><th>Skill</th><th>Owner</th><th>Category</th><th>Level</th><th>Action</th></tr></thead><tbody>{% for s in skills %}<tr><td><b>{{s.name}}</b><small>{{s.description}}</small></td><td>{{s.owner}}</td><td>{{s.category}}</td><td><span class="pill">{{s.level}}</span></td><td><form method="post" onsubmit="return confirm('Delete this skill?')"><input type="hidden" name="id" value="{{s.id}}"><button class="btn danger">Delete</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
