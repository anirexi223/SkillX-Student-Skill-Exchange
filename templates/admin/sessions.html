{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>Sessions Management</h1><p>Monitor scheduled skill exchange sessions.</p></div></div><div class="table-wrap"><table><thead><tr><th>Skill</th><th>Requester</th><th>Teacher</th><th>Date</th><th>Status</th><th>Update</th></tr></thead><tbody>{% for s in rows %}<tr><td>{{s.skill}}</td><td>{{s.requester_name}}</td><td>{{s.teacher_name}}</td><td>{{s.date}} {{s.time}}</td><td><span class="pill {{s.status}}">{{s.status}}</span></td><td><form method="post" class="inline"><input type="hidden" name="id" value="{{s.id}}"><select name="status"><option>upcoming</option><option>ongoing</option><option>completed</option><option>cancelled</option></select><button class="btn primary">Save</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
