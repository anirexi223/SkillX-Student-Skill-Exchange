{% extends "base.html" %}{% block content %}
<div class="detail card"><div class="person"><div class="avatar lg">{{skill.full_name[0]}}</div><div><h1>{{skill.name}}</h1><p>by <a href="{{url_for('profile',id=skill.user_id)}}">{{skill.full_name}}</a> · {{skill.category}}</p></div></div><span class="pill">{{skill.level}}</span><hr><p class="large">{{skill.description}}</p>
{% if skill.user_id != current_user.id %}<section class="form-card"><h2>Request an Exchange</h2><form method="post" action="{{url_for('requests_page')}}"><input type="hidden" name="skill_to_learn_id" value="{{skill.id}}"><label>Your skill to offer (optional)</label><select name="skill_offered_id"><option value="">No skill offered</option>{% for s in my_skills %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select><label>Message</label><textarea name="message" placeholder="Tell them what you'd like to learn..."></textarea><button class="btn primary">Send Request</button></form></section>{% endif %}</div>
{% endblock %}
