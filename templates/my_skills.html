{% extends "base.html" %}{% block content %}
<div class="page-head"><div><h1>My Skills</h1><p>Manage skills you teach.</p></div><a class="btn primary" href="#add">＋ Add Skill</a></div>
<div class="grid">{% for s in skills %}<div class="card"><div class="row between"><div><h3>{{s.name}}</h3><small>{{s.category}}</small></div><span class="pill">{{s.level}}</span></div><p>{{s.description}}</p><details><summary>Edit skill</summary><form method="post" action="{{url_for('edit_skill',id=s.id)}}"><label>Skill Name</label><input name="name" value="{{s.name}}" required><label>Category</label><select name="category_id">{% for c in categories %}<option value="{{c.id}}" {% if c.name==s.category %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select><label>Level</label><select name="level"><option {% if s.level=='Beginner' %}selected{% endif %}>Beginner</option><option {% if s.level=='Intermediate' %}selected{% endif %}>Intermediate</option><option {% if s.level=='Advanced' %}selected{% endif %}>Advanced</option></select><label>Description</label><textarea name="description" required>{{s.description}}</textarea><button class="btn primary">Update</button></form></details><form method="post" action="{{url_for('delete_skill',id=s.id)}}" onsubmit="return confirm('Delete this skill?')"><button class="btn danger">Delete</button></form></div>{% else %}<div class="empty">You haven't added any skills yet.</div>{% endfor %}</div>
<section id="add" class="form-card"><h2>Add a Skill</h2><form method="post" action="{{url_for('add_skill')}}" class="form-grid"><input name="name" placeholder="Skill name" required><select name="category_id" required><option value="">Category</option>{% for c in categories %}<option value="{{c.id}}">{{c.icon}} {{c.name}}</option>{% endfor %}</select><select name="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select><textarea name="description" placeholder="Describe what you can teach..." required></textarea><button class="btn primary">Add Skill</button></form></section>
{% endblock %}
